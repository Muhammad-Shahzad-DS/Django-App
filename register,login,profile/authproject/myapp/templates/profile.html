<!-- ✅ Profile Container -->
<div class="profile-container">
  {% if user.image %}
    <img src="{{ user.image.url }}" alt="Profile Image" />
  {% else %}
    <img src="/media/fallback.png" alt="Default Image" />
  {% endif %}

  <h2>Welcome, {{ user.username }}</h2>
  <p>Email: {{ user.email }}</p>
  <p>Phone: {{ user.phone }}</p>

  <!-- ✅ Navigation Buttons -->
  <div class="nav-buttons">
    <a href="{% url 'logout' %}" class="btn-link logout-btn">Logout</a>
    <a href="{% url 'register' %}" class="btn-link create-btn">Create New Account</a>
  </div>

  <!-- ✅ Action Buttons -->
  <div class="profile-actions">
    <button type="button" class="update-btn" onclick="showUpdateForm()">Update Profile</button>
    <button type="button" id="deleteBtn">Delete Account</button>
  </div>
</div>

<!-- ✅ Update Form -->
<form id="updateForm" method="POST" enctype="multipart/form-data">
  {% csrf_token %}
  <label>Username:</label>
  <input type="text" name="username" id="username" value="{{ user.username }}">

  <label>Email:</label>
  <input type="email" name="email" id="email" value="{{ user.email }}">

  <label>Phone:</label>
  <input type="text" name="phone" id="phone" value="{{ user.phone }}">

  <label>Password:</label>
  <input type="password" name="password" id="password">

  <label>Image:</label>
  <input type="file" name="image" id="image">

  <button type="submit">Update Profile</button>
</form>

<div id="updateMessage"></div>

<!-- ✅ Styles -->
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f4f7fa;
    padding: 20px;
  }

  .profile-container {
    background-color: #ffffff;
    max-width: 500px;
    margin: 30px auto;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 0 12px rgba(0, 0, 0, 0.08);
    text-align: center;
  }

  .profile-container img {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid #007bff;
    margin-bottom: 20px;
  }

  .profile-container h2 {
    color: #007bff;
    margin-bottom: 10px;
  }

  .profile-container p {
    margin: 6px 0;
    font-size: 15px;
  }

  .nav-buttons {
    margin: 20px 0;
    display: flex;
    justify-content: center;
    gap: 15px;
  }

  .btn-link {
    padding: 10px 18px;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
    color: white;
    font-size: 14px;
  }

  .logout-btn {
    background-color: #6c757d;
  }

  .logout-btn:hover {
    background-color: #5a6268;
  }

  .create-btn {
    background-color: #17a2b8;
  }

  .create-btn:hover {
    background-color: #117a8b;
  }

  .profile-actions {
    margin-top: 15px;
  }

  .profile-actions button {
    padding: 10px 18px;
    margin: 10px;
    border: none;
    font-size: 15px;
    border-radius: 6px;
    font-weight: bold;
    color: white;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  .update-btn {
    background-color: #007bff;
  }

  .update-btn:hover {
    background-color: #0056b3;
  }

  #deleteBtn {
    background-color: #dc3545;
  }

  #deleteBtn:hover {
    background-color: #b02a37;
  }

  #updateForm {
    display: none;
    max-width: 500px;
    margin: 20px auto;
    background-color: #fff;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.08);
  }

  #updateForm label {
    font-weight: bold;
    display: block;
    margin-bottom: 6px;
    color: #333;
  }

  #updateForm input {
    width: 100%;
    padding: 10px;
    margin-bottom: 16px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
  }

  #updateForm button[type="submit"] {
    width: 100%;
    padding: 12px;
    background-color: #28a745;
    color: white;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }

  #updateForm button[type="submit"]:hover {
    background-color: #218838;
  }

  #updateMessage p {
    margin-top: 20px;
    padding: 10px;
    border-radius: 6px;
    font-size: 14px;
  }

  #updateMessage p[style*="green"] {
    background-color: #d4edda;
    color: #155724;
  }

  #updateMessage p[style*="red"] {
    background-color: #f8d7da;
    color: #721c24;
  }
</style>

<!-- ✅ jQuery + AJAX Script -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

<script>
  function showUpdateForm() {
    document.getElementById("updateForm").style.display = "block";
  }

  $('#updateForm').submit(function (e) {
    e.preventDefault();

    let formData = new FormData(this);

    $.ajax({
      url: "{% url 'update' %}",
      type: "POST",
      data: formData,
      processData: false,
      contentType: false,
      headers: {
        'X-CSRFToken': '{{ csrf_token }}'
      },
      success: function (response) {
        $('#updateMessage').html(`<p style="color: green;">${response.message}</p>`);
        setTimeout(() => location.reload(), 1000);
      },
      error: function (xhr) {
        let errorMsg = xhr.responseJSON?.errors || "Update failed";
        $('#updateMessage').html(`<p style="color: red;">${errorMsg}</p>`);
      }
    });
  });

  $('#deleteBtn').click(function () {
    if (!confirm("Are you sure you want to delete your account?")) {
      return;
    }

    $.ajax({
      url: "{% url 'delete_account' %}",
      type: "POST",
      headers: {
        'X-CSRFToken': '{{ csrf_token }}'
      },
      success: function (response) {
        if (response.status === 'deleted') {
          alert("Your account has been deleted.");
          window.location.href = "{% url 'login' %}";
        } else {
          alert("Failed to delete account.");
        }
      },
      error: function (xhr) {
        alert("Something went wrong.");
      }
    });
  });
</script>
