<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- ✅ Styles -->
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      padding: 20px;
    }

    #registerHeading {
      text-align: center;
      font-size: 28px;
      color: #007bff;
      margin-top: 30px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    #registerForm {
      background-color: #fff;
      padding: 25px 30px;
      max-width: 500px;
      margin: 20px auto;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    #registerForm label {
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
      color: #333;
    }

    #registerForm input[type="text"],
    #registerForm input[type="email"],
    #registerForm input[type="password"],
    #registerForm input[type="file"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 18px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }

    #registerForm button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    #registerForm button:hover {
      background-color: #0056b3;
    }

    #message {
      margin-bottom: 20px;
      font-size: 14px;
    }

    #message p {
      padding: 10px;
      border-radius: 5px;
    }

    #message p[style*="green"] {
      background-color: #d4edda;
      color: #155724;
    }

    #message p[style*="red"] {
      background-color: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>

  <!-- ✅ Page Heading -->
  <h2 id="registerHeading">Create Your Account</h2>

  <!-- ✅ Register Form -->
  <form id="registerForm" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div id="message"></div>

    <label>Username:</label>
    <input type="text" name="username" id="username" required>

    <label>Email:</label>
    <input type="email" name="email" id="email" required>

    <label>Phone:</label>
    <input type="text" name="phone" id="phone" required>

    <label>Password:</label>
    <input type="password" name="password" id="password" required>

    <label>Image:</label>
    <input type="file" name="image" id="image" required>

    <button type="submit">Register</button>
  </form>

  <!-- ✅ jQuery -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

  <!-- ✅ AJAX Script -->
  <script>
    $('#registerForm').submit(function(e){
      e.preventDefault();

      let formData = new FormData(this);

      $.ajax({
        url: '/register/',
        type: 'POST',
        data: formData,
        processData: false,
        contentType: false,
        headers: {
          'X-CSRFToken': '{{ csrf_token }}'
        },
        success: function(response){
          $('#message').html(`<p style="color: green;">${response.message}</p>`);
          if (response.redirect_url){
            window.location.href = response.redirect_url;
          }
        },
        error: function(xhr){
          let errorMsg = xhr.responseJSON?.errors || "Registration failed";
          $('#message').html(`<p style="color: red;">${JSON.stringify(errorMsg)}</p>`);
        }
      });
    });
  </script>

</body>
</html>
